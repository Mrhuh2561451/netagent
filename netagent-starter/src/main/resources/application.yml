# 设置端口
server:
  port: 8089
# 设置应用名称
spring:
  application:
    name: netagent
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  #pasql配置
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/netagent?client_encoding=UTF8
    # 连接池配置
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: netAgentHikariPool
# redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
# mybatis-plus配置
mybatis-plus:
  # 全局配置
  global-config:
    # 数据库配置
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1 # 删除值
      logic-not-delete-value: 0 # 未删除值
# sa-Token配置
sa-Token:
  # token名称
  token-name: NetAgent
  # token有效期
  timeout: 2592000
  # 是否开启并发控制
  is-concurrent: true
  # 是否开启Token共享
  is-share: true
  # 是否开启Token日志
  is-log: true
  # token样式
  token-style: simple-uuid
  # 是否打印Token
  is-print: false
# Agent 模型配置；密钥通过运行环境传入，不写入仓库
netAgent:
  agent:
    # 未配置密钥时可设为 false，仅启动已有业务模块
    enabled: ${AGENT_ENABLED}
    chat:
      base-url: ${LLM_BASE_URL}
      endpoint-path: ${LLM_ENDPOINT_PATH}
      api-key: ${LLM_API_KEY}
      model: ${LLM_MODEL}









